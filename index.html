<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사칙연산 무역 게임</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#e9edf4; --ink:#1c2632; --muted:#5b6b7f; --panel:#ffffff; --line:#d3dae4;
    --admin:#3551b5; --admin-dark:#26398a; --admin-soft:#eaeefb;
    --ore:#a9691a; --ore-soft:#fbf1de; --ore-line:#e7c58a;
    --num:#0e7c6b; --num-soft:#e2f4f0; --num-line:#a9ddd2;
    --op:#6d4bb0; --op-soft:#efe9f9; --op-line:#cdbcec;
    --trade:#c2410c; --trade-soft:#fdeee2; --trade-line:#f0b892;
    --ok:#1f8a4c; --ok-soft:#e6f6ec; --err:#c23b3b; --err-soft:#fbe9e9;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono","D2Coding",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.45;font-size:17px;padding:16px;-webkit-text-size-adjust:100%;touch-action:manipulation;}
  .wrap{max-width:1200px;margin:0 auto;}
  h1,h2,h3{margin:0;letter-spacing:-.01em;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  input,select{font-family:inherit;}
  .hide{display:none !important;}

  /* ---- tablet optimization ---- */
  @media(min-width:768px){
    body{font-size:19px;padding:20px;}
    .btn{min-height:54px;padding:14px 22px;font-size:17px;}
    .btn.slim{min-height:48px;padding:11px 16px;font-size:16px;}
    .num-in{min-height:52px;font-size:19px;}
    .key{min-height:52px;font-size:21px;}
  }

  .btn{border:none;border-radius:11px;padding:12px 18px;font-size:16px;font-weight:800;min-height:48px;background:var(--admin);color:#fff;transition:filter .12s,transform .05s;}
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:translateY(1px);}
  .btn.ghost{background:var(--admin-soft);color:var(--admin-dark);}
  .btn.ore{background:var(--ore);} .btn.trade{background:var(--trade);}
  .btn.danger{background:var(--err-soft);color:var(--err);}
  .btn.slim{padding:10px 14px;font-size:15px;min-height:44px;}
  .num-in{font-size:17px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);min-height:46px;width:96px;text-align:center;font-family:var(--mono);font-weight:700;}
  select.num-in{font-family:var(--sans);width:auto;text-align:left;}

  /* ---- Landing ---- */
  .pagehead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:2px 2px 20px;}
  .pagehead h1{font-size:30px;font-weight:800;}
  .pagehead .sub{color:var(--muted);font-weight:600;font-size:15px;}
  .landing{display:grid;grid-template-columns:1fr;gap:18px;max-width:560px;margin:0 auto;}
  @media(min-width:640px){.landing{grid-template-columns:1fr 1fr;}}
  .lcard{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 16px rgba(28,38,50,.06);display:flex;flex-direction:column;gap:14px;}
  .lcard h2{font-size:20px;font-weight:800;}
  .lcard.teacher{border-color:var(--admin);} .lcard.group{border-color:var(--ore);}
  .lcard .role{font-size:12.5px;font-weight:800;letter-spacing:.02em;padding:3px 10px;border-radius:999px;align-self:flex-start;}
  .teacher .role{background:var(--admin-soft);color:var(--admin-dark);}
  .group .role{background:var(--ore-soft);color:#7a4d0e;}
  .lcard p{margin:0;color:var(--muted);font-size:14px;}
  .code-in{font-family:var(--mono);font-size:26px;font-weight:800;text-align:center;letter-spacing:.18em;text-transform:uppercase;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;}
  .grp-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .grp-pick button{border:1.5px solid var(--ore-line);background:var(--ore-soft);color:#7a4d0e;border-radius:10px;padding:12px 0;font-weight:800;font-size:16px;}
  .grp-pick button.selected{background:var(--ore);color:#fff;border-color:var(--ore);}
  .grp-pick.compact{grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;}
  .grp-pick.compact button{padding:8px 4px;font-size:13px;}
  .setup{background:#fff;border:2px solid var(--err);border-radius:16px;padding:20px;max-width:720px;margin:0 auto;}
  .setup h2{color:var(--err);margin-bottom:8px;} .setup ol{margin:10px 0 0;padding-left:20px;} .setup li{margin-bottom:8px;}
  .setup code{background:#f2f4f8;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-size:13px;}

  /* ---- top bar (in-game) ---- */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;}
  .topbar .who{font-size:18px;font-weight:800;}
  .codepill{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;}
  .codepill .lbl{font-size:11px;opacity:.7;font-weight:700;} .codepill .val{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:.14em;}
  .conn{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#b7c1cd;} .dot.on{background:var(--ok);} .dot.off{background:var(--err);}
  .spacer{flex:1;}

  .block-label{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .block-label::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--admin);}
  .board .block-label::before{background:var(--ore);}
  .panel{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px rgba(28,38,50,.05);}
  .panel.admin{border:2px solid var(--admin);}

  .board-table{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;}
  .res-cell{background:var(--ore-soft);border:1.5px solid var(--ore-line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .res-cell .rn{font-weight:800;font-size:13px;color:#5f3c0c;display:block;}
  .res-cell .rt{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ore);}

  .ctl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--muted);}
  .divider{width:1px;align-self:stretch;background:var(--line);margin:0 4px;}
  .hint{color:var(--muted);font-size:13px;margin-top:10px;}

  .settings{border-top:1.5px dashed var(--line);margin-top:18px;padding-top:18px;display:none;}
  .settings.open{display:block;}
  .settings-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:880px){.settings-grid{grid-template-columns:1.2fr 1fr;}}
  .res-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .res-edit-row input.rname{flex:1;min-width:0;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;}
  .res-edit-row input.rtarget{width:92px;font-family:var(--mono);font-weight:700;text-align:center;font-size:16px;padding:9px 8px;border:1.5px solid var(--line);border-radius:9px;}
  .res-edit-row .del{background:var(--err-soft);color:var(--err);border:none;border-radius:9px;width:40px;height:40px;font-size:18px;font-weight:800;flex:none;}
  .weights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px;}
  .wcell{display:flex;flex-direction:column;align-items:center;gap:5px;background:#f7f9fc;border:1.5px solid var(--line);border-radius:10px;padding:7px 4px;}
  .wcell .wg{font-family:var(--mono);font-size:21px;font-weight:800;} .wcell.isnum .wg{color:var(--num);} .wcell.isop .wg{color:var(--op);}
  .wcell input{width:100%;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px;padding:6px 2px;border:1.5px solid var(--line);border-radius:7px;}
  .save-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .warn{color:var(--err);font-weight:700;font-size:14px;margin-top:8px;min-height:20px;}

  /* ---- score calculation ---- */
  .score-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .score-cell{display:flex;align-items:center;gap:5px;border-radius:10px;padding:6px 8px;border:1.5px solid var(--line);}
  .score-cell .scn{font-weight:800;font-size:12px;white-space:nowrap;}
  .score-cell input.scp{width:56px;text-align:center;font-family:var(--mono);font-weight:700;font-size:13px;padding:5px 4px;border:1.5px solid var(--line);border-radius:7px;}
  .score-cell .scu{font-size:11px;color:var(--muted);}
  .score-cell button{width:24px;height:24px;border-radius:6px;border:1.5px solid rgba(0,0,0,.15);background:rgba(255,255,255,.65);font-weight:800;font-size:13px;line-height:1;flex:none;}
  .score-cell .scc{font-family:var(--mono);font-weight:800;font-size:13px;min-width:16px;text-align:center;}
  .score-cell.c1{background:var(--num-soft);border-color:var(--num-line);}
  .score-cell.c2{background:var(--admin-soft);border-color:var(--admin);}
  .score-cell.c3{background:var(--ore-soft);border-color:var(--ore-line);}
  .score-cell.c4{background:var(--op-soft);border-color:var(--op-line);}
  .score-summary{font-size:13.5px;font-weight:700;margin:4px 0;}

  /* ---- products (생산품) ---- */
  .prod-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .prod-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;border:1.5px solid var(--line);}
  button.prod-chip{font-family:inherit;cursor:pointer;}
  .prod-chip.selected{outline:3px solid var(--ink);outline-offset:1px;}
  .prod-chip.disabled{opacity:.35;cursor:not-allowed;}
  .prod-chip .cc{font-family:var(--mono);font-weight:800;}
  .prod-chip.sc1{background:var(--num-soft);border-color:var(--num-line);color:#0e6b5c;}
  .prod-chip.sc2{background:var(--admin-soft);border-color:var(--admin);color:#26398a;}
  .prod-chip.sc3{background:var(--ore-soft);border-color:var(--ore-line);color:#7a4d0e;}
  .prod-chip.sc4{background:var(--op-soft);border-color:var(--op-line);color:#553a94;}
  .recipe-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .recipe-row .rname{font-weight:700;font-size:13px;min-width:60px;}
  .recipe-row .del{background:var(--err-soft);color:var(--err);border:none;border-radius:7px;width:30px;height:30px;font-size:16px;font-weight:800;flex:none;}
  .recipe-2col{display:grid;grid-template-columns:1fr;gap:0 24px;}
  @media(min-width:860px){.recipe-2col{grid-template-columns:1fr 1fr;}}
  .recipe-block{border-top:1.5px dashed var(--line);margin-top:14px;padding-top:14px;}
  .score-result{margin-top:14px;padding:14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700;line-height:1.7;}

  /* ---- groups overview / cards ---- */
  .groups{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:720px){.groups{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1080px){.groups{grid-template-columns:repeat(3,1fr);}}
  .group-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:18px;}
  .group-grid>.panel{margin-bottom:0;}
  @media(min-width:820px){.group-grid{grid-template-columns:1fr 1fr;align-items:start;}}
  .gcard{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
  .gcard .gtop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1.5px solid var(--line);background:#f7f9fc;}
  .gcard .gtop .badge{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .gcard .gtop .gn{font-weight:800;font-size:16px;}
  .gcard .gbody{padding:12px;}

  .cards-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;}
  .tile{position:relative;aspect-ratio:1/1.05;border-radius:9px;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;font-weight:800;user-select:none;}
  .tile.num{color:var(--num);background:var(--num-soft);border-color:var(--num-line);}
  .tile.op{color:var(--op);background:var(--op-soft);border-color:var(--op-line);}
  .tile .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--ink);color:#fff;border-radius:999px;font-family:var(--sans);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .tile.zero{opacity:.28;filter:grayscale(.5);} .tile.zero .cnt{background:#9aa7b6;}
  .mini-label{font-size:12px;font-weight:800;color:var(--muted);margin:0 0 7px;}

  /* ---- teacher group-overview compact mode ---- */
  .groups.compact .gcard .gtop{padding:6px 8px;}
  .groups.compact .gcard .gtop .badge{width:20px;height:20px;font-size:11px;}
  .groups.compact .gcard .gtop .gn{font-size:13px;}
  .groups.compact .gcard .gbody{padding:8px;}
  .groups.compact .mini-label{font-size:10px;margin:0 0 4px;}
  .groups.compact .cards-grid{grid-template-columns:repeat(8,1fr);gap:3px;max-width:100%;}
  .groups.compact .tile{font-size:10px;border-radius:6px;}
  .groups.compact .tile .cnt{min-width:13px;height:13px;font-size:8px;top:-4px;right:-4px;}
  .groups.compact .prod-row{gap:3px;margin-bottom:3px;}
  .groups.compact .prod-chip{padding:2px 6px;font-size:10px;gap:3px;}
  .groups.compact .prod-chip .cc{font-size:10px;}
  .groups.compact .btn.slim{min-height:32px;padding:5px 9px;font-size:12px;}

  /* ---- group play ---- */
  .formula-in{width:100%;font-family:var(--mono);font-size:24px;font-weight:700;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;letter-spacing:.06em;color:var(--ink);}
  .formula-in:focus{outline:none;border-color:var(--num);}
  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px;}
  .key{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 0;font-family:var(--mono);font-size:19px;font-weight:800;min-height:44px;}
  .key.n{color:var(--num);} .key.o{color:var(--op);} .key.act{font-family:var(--sans);font-size:13px;color:var(--muted);}
  .key.clearall{grid-column:1 / -1;font-family:var(--sans);font-size:17px;font-weight:800;color:var(--err);background:var(--err-soft);border-color:var(--err-soft);min-height:52px;}
  .gen-btn{margin-top:10px;width:100%;background:var(--ore);color:#fff;border:none;border-radius:12px;padding:14px;font-size:18px;font-weight:800;min-height:54px;}
  .msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;line-height:1.5;}
  .msg.ok{background:var(--ok-soft);color:var(--ok);} .msg.bad{background:var(--err-soft);color:var(--err);}

  /* ---- trades ---- */
  .offer{border:1.5px solid var(--trade-line);background:var(--trade-soft);border-radius:12px;padding:12px;margin-bottom:10px;}
  .offer .ohead{font-weight:800;font-size:14.5px;margin-bottom:8px;color:#8a2d08;}
  .offer .oline{font-size:14px;margin-bottom:4px;}
  .offer .oline b{font-family:var(--mono);}
  .offer .oact{display:flex;gap:8px;margin-top:10px;}
  .mini-cards{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle;}
  .mc{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:2px 7px;font-family:var(--mono);font-weight:800;font-size:14px;}
  .mc .x{font-family:var(--sans);color:var(--muted);font-size:11px;font-weight:700;}
  .mc.none{color:var(--muted);font-family:var(--sans);font-weight:700;font-size:13px;}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,38,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50;}
  .modal{background:#fff;border-radius:18px;max-width:1180px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:19px;font-weight:800;margin-bottom:6px;}
  .modal .sub2{color:var(--muted);font-size:13.5px;margin-bottom:14px;}
  .stepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px;}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0;}
  .stepper .g{font-family:var(--mono);font-weight:800;font-size:13px;text-align:center;padding:5px 7px;border-radius:8px;white-space:nowrap;}
  .stepper.muted .g{color:var(--muted);background:#eef1f5;}
  .stepper.sc1 .g{color:#0e6b5c;background:var(--num-soft);} .stepper.sc2 .g{color:#26398a;background:var(--admin-soft);}
  .stepper.sc3 .g{color:#7a4d0e;background:var(--ore-soft);} .stepper.sc4 .g{color:#553a94;background:var(--op-soft);}
  .stepper .c{font-family:var(--mono);font-weight:800;font-size:15px;min-width:30px;text-align:center;flex:none;}
  .stepper button{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:#f7f9fc;font-weight:800;font-size:15px;line-height:1;flex:none;}
  .stepper .cap{font-size:10px;color:var(--muted);}
  .modal .foot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .footnote{text-align:center;color:var(--muted);font-size:12.5px;margin:24px 0 6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <h1>사칙연산 무역 게임</h1>
    <span class="sub">사칙연산으로 자원을 만들고 조합하여 물건을 생산해요!</span>
  </div>

  <div id="screen"></div>

  <p class="footnote">만든이: 하이쌤</p>
</div>

<script>
"use strict";

/* =====================================================================
   ① 파이어베이스 설정 — 콘솔에서 복사한 값이 이미 채워져 있어요.
   다른 프로젝트를 쓰려면 이 값을 새 프로젝트 값으로 바꿔주세요.
   ===================================================================== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9hl_DWPbnViGzMnNVd9I25nlogrdpTso",
  authDomain: "trade-game-49a71.firebaseapp.com",
  projectId: "trade-game-49a71",
  storageBucket: "trade-game-49a71.firebasestorage.app",
  messagingSenderId: "442725138300",
  appId: "1:442725138300:web:84c1f7968fcdca9a2daef9"
};

/* ---------------- 상수 & 파서 (오프라인판과 동일) ---------------- */
var NUMS=["1","2","3","4","5","6","7","8","9"];
var OPS=["+","−","×","÷","(",")"]; var ALL=NUMS.concat(OPS);

function emptyCards(scoreCategories){
  var c={}; ALL.forEach(function(k){ c[k]=0; });
  (scoreCategories||defaultScoreCategories()).forEach(function(cat){ cat.items.forEach(function(it){ c[it.id]=0; }); });
  return c;
}
function defaultWeights(){ var w={}; ALL.forEach(function(k){ w[k]=(k==="+"||k==="−"||k==="×"||k==="÷")?2:1; }); return w; }
function randomUniqueTargets(n,min,max){
  var vals=[],seen={},tries=0;
  while(vals.length<n && tries<5000){
    tries++;
    var v=min+Math.floor(Math.random()*(max-min+1));
    if(!seen[v]){ seen[v]=true; vals.push(v); }
  }
  return vals;
}
function defaultResources(){
  var names=["물","밀","모래","목재","과일","목화","철광석","석유"];
  var targets=randomUniqueTargets(names.length,2,90);

function normalize(str){
  return String(str).replace(/\s+/g,"").replace(/[*xX✕✖＊]/g,"×").replace(/[\/÷]/g,"÷").replace(/[-−–—ー]/g,"−").replace(/[+＋]/g,"+").replace(/[（]/g,"(").replace(/[）]/g,")");
}
function tokenize(str){
  var tokens=[],chars=str.split(""),i;
  for(i=0;i<chars.length;i++){ var ch=chars[i];
    if(ch>="1"&&ch<="9") tokens.push({t:"num",v:+ch,card:ch});
    else if(ch==="0") return {error:"‘0’ 카드는 없어요. 숫자 카드는 1~9만 사용할 수 있어요."};
    else if(ch==="+"||ch==="−"||ch==="×"||ch==="÷") tokens.push({t:"op",v:ch,card:ch});
    else if(ch==="(") tokens.push({t:"lp",card:"("});
    else if(ch===")") tokens.push({t:"rp",card:")"});
    else return {error:"사용할 수 없는 문자예요: ‘"+ch+"’"};
  }
  return {tokens:tokens};
}
function countCards(tokens){ var c={}; tokens.forEach(function(tk){ if(tk.card) c[tk.card]=(c[tk.card]||0)+1; }); return c; }
var PREC={"+":1,"−":1,"×":2,"÷":2};
function evaluate(tokens){
  var out=[],ops=[],i,top;
  for(i=0;i<tokens.length;i++){ var tk=tokens[i];
    if(tk.t==="num") out.push(tk);
    else if(tk.t==="op"){ while(ops.length){ top=ops[ops.length-1]; if(top.t==="op"&&PREC[top.v]>=PREC[tk.v]) out.push(ops.pop()); else break; } ops.push(tk); }
    else if(tk.t==="lp") ops.push(tk);
    else if(tk.t==="rp"){ while(ops.length&&ops[ops.length-1].t!=="lp") out.push(ops.pop()); if(!ops.length) return {error:"괄호 짝이 맞지 않아요. ‘)’에 맞는 ‘(’가 없어요."}; ops.pop(); }
  }
  while(ops.length){ top=ops.pop(); if(top.t==="lp") return {error:"괄호 짝이 맞지 않아요. ‘(’에 맞는 ‘)’가 없어요."}; out.push(top); }
  var st=[];
  for(i=0;i<out.length;i++){ var o=out[i];
    if(o.t==="num") st.push(o.v);
    else{ if(st.length<2) return {error:"수식 형태가 올바르지 않아요. 연산자 위치를 확인해 주세요."};
      var b=st.pop(),a=st.pop(),r;
      if(o.v==="+") r=a+b; else if(o.v==="−") r=a-b; else if(o.v==="×") r=a*b;
      else{ if(b===0) return {error:"0으로 나눌 수 없어요."}; r=a/b; } st.push(r); }
  }
  if(st.length!==1) return {error:"수식 형태가 올바르지 않아요. 숫자와 연산자 개수를 확인해 주세요."};
  return {value:st[0]};
}

function pickCard(weights){ var total=0,i; for(i=0;i<ALL.length;i++) total+=Math.max(0,weights[ALL[i]]||0); if(total<=0) return null; var r=Math.random()*total; for(i=0;i<ALL.length;i++){ r-=Math.max(0,weights[ALL[i]]||0); if(r<0) return ALL[i]; } return ALL[ALL.length-1]; }

/* ---------------- 초기화 ---------------- */
function configOk(){ return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("여기에")<0; }
function init(){
  if(!configOk()){ renderSetup(); return; }
  try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); ready=true; }
  catch(e){ renderSetup("파이어베이스 초기화에 실패했어요. 설정값을 다시 확인해 주세요."); return; }
  // 연결 상태 표시용
  db.enableNetwork().then(function(){ connected=true; renderCurrent(); }).catch(function(){});
  restoreSession();
}
function restoreSession(){
  try{
    var s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");
    if(s&&s.code&&s.role){ role=s.role; code=s.code; myIdx=(typeof s.myIdx==="number")?s.myIdx:null; subscribe(); return; }
  }catch(e){}
  renderLanding();
}
function saveSession(){ try{ sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:role,code:code,myIdx:myIdx})); }catch(e){} }
function clearSession(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }

/* ---------------- 실시간 구독 ---------------- */
function subscribe(){
  if(unsubGame) unsubGame(); if(unsubTrades) unsubTrades();
  unsubGame=gameRef().onSnapshot(function(snap){
    connected=true;
    if(!snap.exists){ alert("게임을 찾을 수 없어요(코드가 바뀌었거나 삭제됨)."); leave(); return; }
    game=snap.data(); renderCurrent();
  }, function(){ connected=false; renderCurrent(); });
  unsubTrades=gameRef().collection("trades").orderBy("createdAt","desc").limit(80).onSnapshot(function(qs){
    trades=qs.docs.map(function(d){ var o=d.data(); o.id=d.id; return o; }); renderCurrent();
  }, function(){});
  saveSession();
}
function leave(){ if(unsubGame) unsubGame(); if(unsubTrades) unsubTrades(); unsubGame=unsubTrades=null; role=code=myIdx=null; game=null; trades=[]; formula=""; groupMsg=tradeMsg=productMsg=null; clearAllMsgTimers(); clearSession(); renderLanding(); }

function doDistribute(idxOrAll,n){
  db.runTransaction(function(tx){
    return tx.get(gameRef()).then(function(snap){
      var data=snap.data(); var targets=(idxOrAll==="all")?data.groups.map(function(_,i){return i;}):[idxOrAll];
      var any=false;
      targets.forEach(function(i){ for(var c=0;c<n;c++){ var card=pickCard(data.weights); if(card){ data.groups[i].cards[card]++; any=true; } } });
      if(!any) throw new Error("NOWEIGHT");
      tx.update(gameRef(),{groups:data.groups});
    });
  }).catch(function(e){ if(String(e.message).indexOf("NOWEIGHT")>=0) alert("배분 비율이 모두 0이에요. 설정에서 조절해 주세요."); else alert("배분에 실패했어요. 다시 시도해 주세요."); });
}
function saveSettings(){
  var warn=$("settingsWarn"); warn.textContent="";
  var gc=parseInt($("setGroupCount").value,10);
  if(isNaN(gc)||gc<1||gc>12){ warn.textContent="모둠 수는 1~12 사이로 입력해 주세요."; return; }
  var rows=$("resEditor").querySelectorAll(".res-edit-row"), newRes=[], seen={}, ok=true, msg="", counter=(game.nextId||1);
  Array.prototype.forEach.call(rows,function(row){
    var name=row.querySelector(".rname").value.trim(), tRaw=row.querySelector(".rtarget").value.trim();
    if(name===""&&tRaw==="") return;
    if(name===""){ ok=false; msg="자원 이름을 비워둘 수 없어요."; return; }
    if(tRaw===""){ ok=false; msg="‘"+name+"’의 목표 숫자를 입력해 주세요."; return; }
    var tv=Number(tRaw); if(isNaN(tv)){ ok=false; msg="‘"+name+"’의 목표 숫자가 숫자가 아니에요."; return; }
    if(seen[String(tv)]){ ok=false; msg="목표 숫자가 중복됐어요: "+tv; return; } seen[String(tv)]=true;
    var id=row.dataset.id; if(id.indexOf("new")===0){ id="r"+(counter++); }
    newRes.push({id:id,name:name,target:tv});
  });
  if(!ok){ warn.textContent=msg; return; }
  if(!newRes.length){ warn.textContent="자원이 최소 1개는 있어야 해요."; return; }
  var newW={}; Array.prototype.forEach.call($("weightsGrid").querySelectorAll("input"),function(i){ var v=Number(i.value); if(isNaN(v)||v<0)v=0; newW[i.dataset.card]=v; });

  db.runTransaction(function(tx){
    return tx.get(gameRef()).then(function(snap){
      var data=snap.data();
      if(gc<data.groups.length){ if(!confirm("모둠 수를 "+data.groups.length+"→"+gc+"로 줄이면 마지막 모둠들의 카드·자원이 삭제돼요. 진행할까요?")) throw new Error("CANCEL"); data.groups.length=gc; }
      else { while(data.groups.length<gc) data.groups.push(makeGroup(data.groups.length,newRes,data.products||defaultProducts(),data.scoreCategories||defaultScoreCategories())); }
      data.groups.forEach(function(g){ var res={},red={}; newRes.forEach(function(r){ res[r.id]=g.resources[r.id]||0; red[r.id]=(g.redeemed&&g.redeemed[r.id])||0; }); g.resources=res; g.redeemed=red; });
      data.resources=newRes; data.weights=newW; data.groupCount=gc; data.nextId=counter;
      tx.update(gameRef(),{groups:data.groups,resources:newRes,weights:newW,groupCount:gc,nextId:counter});
    });

}

/* ---------------- 자원 생성 ---------------- */
function doGenerate(){
  var raw=(formula||"").trim();
  if(!raw){ groupMsg={ok:false,text:"수식을 입력해 주세요."}; return renderGroup(); }
  var tk=tokenize(normalize(raw));
  if(tk.error){ groupMsg={ok:false,text:tk.error}; return renderGroup(); }
  if(!tk.tokens.length){ groupMsg={ok:false,text:"수식을 입력해 주세요."}; return renderGroup(); }
  var need=countCards(tk.tokens);
  var ev=evaluate(tk.tokens);
  if(ev.error){ groupMsg={ok:false,text:ev.error}; return renderGroup(); }
  var missingOps=["+","−","×","÷"].filter(function(op){ return !need[op]; });
  if(missingOps.length){ groupMsg={ok:false,text:"사칙연산을 모두 한 번씩은 써야 해요. 아직 안 쓴 연산: "+missingOps.join(" ")}; return renderGroup(); }
  var match=null; for(var i=0;i<game.resources.length;i++){ if(Math.abs(ev.value-game.resources[i].target)<1e-9){ match=game.resources[i]; break; } }
  if(!match){
    groupMsg={ok:false,text: game.hintsEnabled ? ("현재 계산 값은 "+pretty(ev.value)+"이에요. 다시 생각해보세요.") : "계산이 틀렸어요. 다시 생각해 보세요."};
    return renderGroup();
  }

  db.runTransaction(function(tx){
    return tx.get(gameRef()).then(function(snap){
      var data=snap.data(), gg=data.groups[myIdx], short=[];
      for(var k in need){ if(need[k]>(gg.cards[k]||0)) short.push("‘"+k+"’ "+(need[k]-(gg.cards[k]||0))+"장"); }
      if(short.length) throw new Error("SHORT:"+short.join(", "));
      for(var c in need){ gg.cards[c]-=need[c]; }
      gg.resources[match.id]=(gg.resources[match.id]||0)+1;
      tx.update(gameRef(),{groups:data.groups});
    });
  }).then(function(){ formula=""; groupMsg={ok:true,text:"성공! "+pretty(ev.value)+" = "+match.name+" 1개를 만들었어요."}; renderGroup(); })
    .catch(function(e){ var m=String(e.message||e); if(m.indexOf("SHORT:")===0) groupMsg={ok:false,text:"카드가 부족해요 — "+m.slice(6)+" 더 필요해요."}; else groupMsg={ok:false,text:"생성 중 문제가 생겼어요. 다시 시도해 주세요."}; renderGroup(); });
}

/* ---------------- 점수 계산 ---------------- */
function liveScoreCounts(g){
  var cats=game.scoreCategories||defaultScoreCategories();
  var counts={};
  cats.forEach(function(cat){
    cat.items.forEach(function(it){
      var n=0, r=null, p=null;
      game.resources.forEach(function(rr){ if(rr.name===it.name) r=rr; });
      if(r){ n=(g.redeemed&&g.redeemed[r.id])||0; }
      else{
        (game.products||defaultProducts()).forEach(function(pp){ if(pp.name===it.name) p=pp; });
        if(p) n=(g.products&&g.products[p.id])||0;
      }
      counts[it.id]=n;
    });
  });
  return counts;
}
function computeScore(cats,counts){
  var base=0,bonus=0,penalty=0,catDetails=[];
  cats.forEach(function(cat){
    var catBase=0,enteredTypes=0,total=cat.items.length;
    cat.items.forEach(function(it){
      var c=counts[it.id]||0;
      catBase+=c*it.points;
      if(c>0) enteredTypes++;
    });
    base+=catBase;
    var catBonus=0,catPenalty=0;
    if(enteredTypes===total){ catBonus=100; bonus+=100; }
    else if(enteredTypes<total/2){ catPenalty=100; penalty+=100; }
    catDetails.push({enteredTypes:enteredTypes,total:total,catBase:catBase,catBonus:catBonus,catPenalty:catPenalty});
  });
  return {base:base,bonus:bonus,penalty:penalty,total:base+bonus-penalty,catDetails:catDetails};
}
function scoreCountsMatchCards(counts,cardsObj,cats){
  var match=true;
  cats.forEach(function(cat){ cat.items.forEach(function(it){ if((counts[it.id]||0)!==((cardsObj&&cardsObj[it.id])||0)) match=false; }); });
  return match;
}
function openScoreModal(){
  var cats=game.scoreCategories||defaultScoreCategories();
  var g=game.groups[myIdx];
  var counts=liveScoreCounts(g);
  var ov=document.createElement("div"); ov.className="overlay";
  function draw(resultHTML){
    var rowsHTML=cats.map(function(cat,ci){
      var cellsHTML=cat.items.map(function(it){
        var v=counts[it.id]||0;
        return '<div class="score-cell c'+((ci%4)+1)+'"><span class="scn">'+esc(it.name)+'</span>'+
          '<button type="button" data-sminus="'+esc(it.id)+'">−</button><span class="scc">'+v+'</span><button type="button" data-splus="'+esc(it.id)+'">＋</button></div>';
      }).join("");
      return '<div class="score-row">'+cellsHTML+'</div>';
    }).join("");
    ov.innerHTML='<div class="modal"><h3>점수 계산</h3><p class="sub2">가지고 있는 카드 개수가 자동으로 채워져 있어요. 다르면 직접 조정한 뒤 계산하기를 눌러주세요.</p>'+
      rowsHTML+
      '<div class="foot"><button class="btn ore" id="scCalc">계산하기</button><button class="btn ghost" id="scClose">닫기</button></div>'+
      (resultHTML||'')+
      '</div>';
    Array.prototype.forEach.call(ov.querySelectorAll("[data-sminus]"),function(b){ b.onclick=function(){ var id=b.getAttribute("data-sminus"); counts[id]=Math.max(0,(counts[id]||0)-1); draw(); }; });
    Array.prototype.forEach.call(ov.querySelectorAll("[data-splus]"),function(b){ b.onclick=function(){ var id=b.getAttribute("data-splus"); counts[id]=(counts[id]||0)+1; draw(); }; });
    $("scClose").onclick=function(){ document.body.removeChild(ov); };
    $("scCalc").onclick=function(){
      var r=computeScore(cats,counts);
      db.runTransaction(function(tx){
        return tx.get(gameRef()).then(function(snap){
          var data=snap.data();
          data.groups[myIdx].scoreCounts=counts;
          tx.update(gameRef(),{groups:data.groups});
        });
      }).catch(function(){});
      draw('<div class="score-result">기본 점수 '+r.base+'점 + 보너스 '+r.bonus+'점 − 벌칙 '+r.penalty+'점 = 총 '+r.total+'점</div>');
    };
  }
  document.body.appendChild(ov); draw();
}

  if(toIdx===null){ alert("교환할 다른 모둠이 없어요."); return; }

  var ov=document.createElement("div"); ov.className="overlay";
  var TRADE_KEYS=ALL.concat(game.resources.map(function(r){return r.id;})).concat((game.products||defaultProducts()).map(function(p){return p.id;}));
  var WANT_KEYS=TRADE_KEYS, GIVE_KEYS=TRADE_KEYS;
  function ownedCount(k){
    if(isResourceId(k)) return (g.redeemed&&g.redeemed[k])||0;
    if(isProductId(k)) return (g.products&&g.products[k])||0;
    return g.cards[k]||0;
  }
  function giveCards(){ return GIVE_KEYS.filter(function(k){return ownedCount(k)>0;}); }

  function draw(){
    var giveGrid=giveCards().map(function(k){ var cls=cardCatClass(k),c=giveSel[k]||0;
      return '<div class="stepper '+cls+'"><button data-gminus="'+esc(k)+'">−</button><span class="g">['+esc(cardDisplayName(k))+'카드]</span><span class="c">'+c+'장</span><button data-gplus="'+esc(k)+'">＋</button></div>';
    }).join("") || '<p class="hint" style="margin:0">가진 카드가 없어요. 아래에서 받고 싶은 카드만 골라 요청할 수 있어요.</p>';
    var wantGrid=WANT_KEYS.map(function(k){ var cls=cardCatClass(k),c=wantSel[k]||0;
      return '<div class="stepper '+cls+'"><button data-wminus="'+esc(k)+'">−</button><span class="g">['+esc(cardDisplayName(k))+'카드]</span><span class="c">'+c+'장</span><button data-wplus="'+esc(k)+'">＋</button></div>';
    }).join("");
    ov.innerHTML='<div class="modal"><h3>교환 제안</h3><p class="sub2">내가 줄 카드와 받고 싶은 카드를 정해 상대 모둠에 보냅니다.</p>'+
      '<div class="field" style="margin-bottom:14px"><label>어느 모둠에게?</label><div class="grp-pick compact" id="tmToPick">'+
        others.map(function(o){return '<button type="button" data-to="'+o.i+'" class="'+(o.i===toIdx?"selected":"")+'">'+esc(o.name)+'</button>';}).join("")+'</div></div>'+
      '<p class="mini-label">내가 줄 카드 <span style="color:var(--muted);font-weight:600">(가진 만큼만)</span></p><div class="stepgrid">'+giveGrid+'</div>'+
      '<p class="mini-label" style="margin-top:14px">받고 싶은 카드</p><div class="stepgrid">'+wantGrid+'</div>'+
      '<div class="foot"><button class="btn trade" id="tmSend">제안 보내기</button><button class="btn ghost" id="tmCancel">닫기</button></div></div>';

    Array.prototype.forEach.call(ov.querySelectorAll("[data-to]"),function(b){ b.onclick=function(){ toIdx=+b.getAttribute("data-to"); draw(); }; });
    function bind(attr,obj,capFn){ Array.prototype.forEach.call(ov.querySelectorAll("["+attr+"]"),function(b){ b.onclick=function(){ var k=b.getAttribute(attr); var d=attr.indexOf("plus")>=0?1:-1; var nv=(obj[k]||0)+d; var cap=capFn(k); if(nv<0)nv=0; if(nv>cap)nv=cap; obj[k]=nv; draw(); }; }); }
    bind("data-gplus",giveSel,function(k){return ownedCount(k);}); bind("data-gminus",giveSel,function(k){return ownedCount(k);});
    bind("data-wplus",wantSel,function(){return 20;}); bind("data-wminus",wantSel,function(){return 20;});
    $("tmSend").onclick=function(){ sendTrade(toIdx,giveSel,wantSel,ov); };
    $("tmCancel").onclick=function(){ document.body.removeChild(ov); };
  }
  document.body.appendChild(ov); draw();
}
function cleanSel(sel){ var o={}; for(var k in sel){ if(sel[k]>0) o[k]=sel[k]; } return o; }
function sendTrade(toIdx,giveSel,wantSel,ov){
  var give=cleanSel(giveSel), want=cleanSel(wantSel);
  if(!Object.keys(give).length && !Object.keys(want).length){ alert("주거나 받을 카드를 하나 이상 정해 주세요."); return; }
  gameRef().collection("trades").add({
    from:myIdx, to:toIdx, fromName:game.groups[myIdx].name, toName:game.groups[toIdx].name,
    give:give, want:want, status:"pending", createdAt:Date.now()
  }).then(function(){ if(ov&&ov.parentNode) document.body.removeChild(ov); tradeMsg={ok:true,text:"제안을 보냈어요. 상대 모둠의 수락을 기다려요."}; renderGroup(); })
    .catch(function(){ alert("제안 전송에 실패했어요."); });
}
function findTrade(id){ for(var i=0;i<trades.length;i++){ if(trades[i].id===id) return trades[i]; } return null; }
function acceptTrade(id){
  var t=findTrade(id); if(!t) return;
  db.runTransaction(function(tx){
    var tRef=gameRef().collection("trades").doc(id);
    return tx.get(gameRef()).then(function(gs){ return tx.get(tRef).then(function(ts){
      if(!ts.exists||ts.data().status!=="pending") throw new Error("DONE");
      var data=gs.data(), from=data.groups[t.from], to=data.groups[t.to], k;
      from.redeemed=from.redeemed||{}; to.redeemed=to.redeemed||{};
      from.products=from.products||{}; to.products=to.products||{};
      function owned(gr,k){
        if(isResourceId(k,data.resources)) return gr.redeemed[k]||0;
        if(isProductId(k,data.products)) return gr.products[k]||0;
        return gr.cards[k]||0;
      }
      function addOwned(gr,k,n){
        if(isResourceId(k,data.resources)) gr.redeemed[k]=(gr.redeemed[k]||0)+n;
        else if(isProductId(k,data.products)) gr.products[k]=(gr.products[k]||0)+n;
        else gr.cards[k]=(gr.cards[k]||0)+n;
      }
      function subOwned(gr,k,n){
        if(isResourceId(k,data.resources)) gr.redeemed[k]-=n;
        else if(isProductId(k,data.products)) gr.products[k]-=n;
        else gr.cards[k]-=n;
      }
      for(k in t.give){ if(owned(from,k)<t.give[k]) throw new Error("FROM"); }
      for(k in t.want){ if(owned(to,k)<t.want[k]) throw new Error("TO"); }
      for(k in t.give){ subOwned(from,k,t.give[k]); addOwned(to,k,t.give[k]); }
      for(k in t.want){ subOwned(to,k,t.want[k]); addOwned(from,k,t.want[k]); }
      tx.update(gameRef(),{groups:data.groups});
      tx.update(tRef,{status:"accepted"});
    }); });
  }).then(function(){ tradeMsg={ok:true,text:t.fromName+" ↔ "+t.toName+" 교환 완료! 카드가 서로 바뀌었어요."}; renderCurrent(); })
    .catch(function(e){ var m=String(e.message||e);
      if(m.indexOf("DONE")>=0) tradeMsg={ok:false,text:"이미 처리된 제안이에요."};
      else if(m.indexOf("FROM")>=0) tradeMsg={ok:false,text:t.fromName+"의 카드가 부족해서 교환할 수 없어요."};
      else if(m.indexOf("TO")>=0) tradeMsg={ok:false,text:t.toName+"의 카드가 부족해서 교환할 수 없어요."};
      else tradeMsg={ok:false,text:"교환 중 문제가 생겼어요. 다시 시도해 주세요."};
      renderCurrent(); });
}
function setTradeStatus(id,status){ gameRef().collection("trades").doc(id).update({status:status}).catch(function(){}); }
function acceptProductRequest(id){
  var t=findTrade(id); if(!t) return;
  db.runTransaction(function(tx){
    var tRef=gameRef().collection("trades").doc(id);
    return tx.get(gameRef()).then(function(gs){ return tx.get(tRef).then(function(ts){
      if(!ts.exists||ts.data().status!=="pending") throw new Error("DONE");
      var data=gs.data(), gg=data.groups[t.from];
      var products=data.products||defaultProducts(), prod=null;
      for(var i=0;i<products.length;i++){ if(products[i].id===t.productId){ prod=products[i]; break; } }
      if(!prod) throw new Error("NOPROD");
      var needRes=(prod.recipe&&prod.recipe.res)||{}, needProd=(prod.recipe&&prod.recipe.prod)||{};
      var short=false;
      gg.redeemed=gg.redeemed||{};
      for(var rid in needRes){ if(needRes[rid]>(gg.redeemed[rid]||0)) short=true; }
      var gp=gg.products||{};
      for(var pid in needProd){ if(needProd[pid]>(gp[pid]||0)) short=true; }
      if(short) throw new Error("SHORT");
      for(var rid2 in needRes){ gg.redeemed[rid2]-=needRes[rid2]; }
      for(var pid2 in needProd){ gp[pid2]-=needProd[pid2]; }
      gp[t.productId]=(gp[t.productId]||0)+1;
      gg.products=gp;
      tx.update(gameRef(),{groups:data.groups});
      tx.update(tRef,{status:"accepted"});
    }); });
  }).then(function(){ renderCurrent(); })
    .catch(function(e){ var m=String(e.message||e);
      if(m.indexOf("DONE")>=0) alert("이미 처리된 신청이에요.");
      else if(m.indexOf("SHORT")>=0) alert("그 모둠에 재료가 부족해서 수락할 수 없어요.");
      else alert("처리 중 문제가 생겼어요.");
      renderCurrent(); });
}

/* ---------------- 시작 ---------------- */
init();
</script>
